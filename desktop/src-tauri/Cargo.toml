[package]
name = "doubao-watermark-remover"
version = "0.5.5"
description = "Remove Doubao AI watermark from PNG images"
edition = "2021"
default-run = "doubao-watermark-remover"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "doubao_clean"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clean-cli"
path = "src/bin/clean_cli.rs"

[dependencies]
base64 = "0.22"
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ort = "2.0.0-rc.10"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = "0.25"
ab_glyph = "0.2"
ureq = { version = "2", features = ["rustls"] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-notification = "2.4.0"

[dev-dependencies]
# 仅测试用：手工生成带色彩块的 PNG（image 的 PNG 编码器不写 iCCP/sRGB）+ 与 image 同版本
png = "0.17"

[profile.release]
strip = true
lto = true
