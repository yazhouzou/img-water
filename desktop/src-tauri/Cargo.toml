[package]
name = "doubao-watermark-remover"
version = "0.1.0"
description = "Remove Doubao AI watermark from PNG images"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
strip = true
lto = true
