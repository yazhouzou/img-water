<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>豆包水印清理助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">去</span>
      <div>
        <h1>豆包水印清理助手</h1>
        <p class="subtitle">批量去除图片右下角“豆包AI生成”水印</p>
      </div>
    </div>
    <div class="env-area">
      <div id="model-progress" class="model-progress" hidden>
        <div class="model-progress-track">
          <div id="model-progress-bar" class="model-progress-bar"></div>
        </div>
        <span id="model-progress-text" class="model-progress-text"></span>
      </div>
      <button id="btn-setup" class="btn primary small" hidden>一键下载修复模型</button>
      <div id="env-badge" class="badge">检查环境中…</div>
    </div>
  </header>

  <main class="layout">
    <section class="panel files-panel">
      <div class="panel-head">
        <h2>图片文件</h2>
        <div class="actions">
          <button id="btn-pick" class="btn">选择文件夹</button>
          <button id="btn-refresh" class="btn ghost" disabled>刷新</button>
        </div>
      </div>
      <div id="folder-path" class="folder-path">未选择文件夹</div>
      <div class="list-actions">
        <button id="btn-select-all" class="btn small ghost" disabled>全选</button>
        <button id="btn-select-none" class="btn small ghost" disabled>清空</button>
        <span id="file-count" class="muted">0 张</span>
      </div>
      <div id="file-list" class="file-list">
        <div class="placeholder">先选择图片或文件夹</div>
      </div>
      <div class="run-area">
        <div class="mask-row">
          <button id="btn-mask" class="btn small" disabled>框选水印</button>
          <span id="mask-status" class="muted">未框选，自动检测水印</span>
          <button id="btn-mask-clear" class="btn small ghost" hidden>清除框选</button>
        </div>
        <label class="checkbox">
          <input type="checkbox" id="keep-work" />
          处理后保留备份与复查图（便于人工检查）
        </label>
        <button id="btn-run" class="btn primary" disabled>开始处理</button>
        <button id="btn-cleanup" class="btn danger ghost" disabled>清理本轮产物</button>
      </div>
    </section>

    <section class="panel right-panel">
      <div class="panel-head">
        <h2>处理结果</h2>
      </div>
      <div id="result-banner" class="result-banner" hidden></div>
      <div class="review-grid">
        <figure class="review-box">
          <figcaption><i class="dot dot-candidate"></i>处理前预览（原水印位置）</figcaption>
          <div id="review-candidate" class="review-img"><div class="placeholder">开始处理后，这里显示修复前预览</div></div>
        </figure>
        <figure class="review-box">
          <figcaption><i class="dot dot-final"></i>处理后预览</figcaption>
          <div id="review-final" class="review-img"><div class="placeholder">开始处理后，这里显示修复后预览</div></div>
        </figure>
      </div>
      <details id="log-box" class="log-box">
        <summary>
          <span>运行日志</span>
          <button id="btn-clear-log" class="btn small ghost" type="button">清空</button>
        </summary>
        <pre id="log" class="log"></pre>
      </details>
    </section>
  </main>

  <div id="mask-overlay" class="mask-overlay" hidden>
    <div class="mask-dialog">
      <div class="mask-head">
        <span>拖拽框选水印区域（以第一张选中图为例，框会按右下角偏移应用到所有选中图）</span>
        <button id="btn-mask-cancel" class="btn small ghost" type="button">取消</button>
      </div>
      <div id="mask-canvas-wrap" class="mask-canvas-wrap">
        <img id="mask-img" src="" alt="框选参考图" draggable="false" />
        <div id="mask-rect" class="mask-rect" hidden></div>
      </div>
      <div class="mask-foot">
        <span id="mask-hint" class="muted">按住鼠标拖出一个矩形，覆盖住水印文字即可</span>
        <div>
          <button id="btn-mask-reset" class="btn small ghost" type="button" disabled>重画</button>
          <button id="btn-mask-ok" class="btn primary small" type="button" disabled>确认框选</button>
        </div>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox">
    <img src="" alt="预览大图" />
  </div>

  <script src="mock.js"></script>
  <script src="main.js"></script>
</body>
</html>
