<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图片水印清理助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">去</span>
      <div>
        <h1>图片水印清理助手</h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
    </div>
    <div class="env-area">
      <div id="model-progress" class="model-progress" hidden>
        <div class="model-progress-track">
          <div id="model-progress-bar" class="model-progress-bar"></div>
        </div>
        <span id="model-progress-text" class="model-progress-text"></span>
      </div>
      <button id="btn-setup" class="btn primary small" hidden data-i18n="setupModel"></button>
      <button id="btn-check-update" class="btn small ghost" data-i18n="checkUpdate"></button>
      <button id="btn-theme" class="btn small ghost" title="切换深浅色">🌙</button>
      <button id="btn-lang" class="btn small ghost">EN</button>
      <div id="env-badge" class="badge" data-i18n="envChecking"></div>
    </div>
  </header>

  <main class="layout">
    <section class="panel files-panel">
      <div class="panel-head">
        <h2 data-i18n="filesTitle"></h2>
        <div class="actions">
          <button id="btn-pick" class="btn" data-i18n="pickFolder"></button>
          <button id="btn-refresh" class="btn ghost" disabled data-i18n="refresh"></button>
        </div>
      </div>
      <div id="folder-path" class="folder-path" data-i18n="noFolder"></div>
      <div id="setup-hint" class="setup-hint" hidden>
        <p data-i18n="setupHintTitle"></p>
        <ul>
          <li id="setup-hint-path">下载后保存在应用数据目录，与图片无关</li>
          <li data-i18n="setupHintPrivacy"></li>
          <li id="setup-hint-wifi" hidden data-i18n="setupHintWifi"></li>
        </ul>
        <button id="btn-setup-inline" class="btn primary small" hidden data-i18n="setupModel"></button>
      </div>
      <div class="list-actions">
        <button id="btn-select-all" class="btn small ghost" disabled data-i18n="selectAll"></button>
        <button id="btn-select-none" class="btn small ghost" disabled data-i18n="selectNone"></button>
        <span id="file-count" class="muted">0 张</span>
      </div>
      <div id="file-list" class="file-list">
        <div class="placeholder">先选择图片或文件夹</div>
      </div>
      <div class="run-area">
        <div class="mask-row">
          <button id="btn-mask" class="btn small" disabled data-i18n="pickMask"></button>
          <span id="mask-status" class="muted" data-i18n="maskAuto"></span>
          <button id="btn-mask-clear" class="btn small ghost" hidden data-i18n="maskClear"></button>
        </div>
        <div class="output-row" id="output-row">
          <span class="output-label" data-i18n="outputLabel"></span>
          <label class="radio"><input type="radio" name="output-mode" value="save" checked /><span data-i18n="outputSave"></span></label>
          <label class="radio"><input type="radio" name="output-mode" value="overwrite" /><span data-i18n="outputOverwrite"></span></label>
        </div>
        <label class="checkbox">
          <input type="checkbox" id="keep-work" />
          <span data-i18n="keepWork"></span>
        </label>
        <div class="run-buttons">
          <button id="btn-run" class="btn primary" disabled data-i18n="run"></button>
          <button id="btn-cancel" class="btn danger" hidden data-i18n="cancel"></button>
          <button id="btn-cleanup" class="btn danger ghost" disabled data-i18n="cleanup"></button>
        </div>
        <div id="run-progress" class="run-progress" hidden>
          <div class="run-progress-track">
            <div id="run-progress-bar" class="run-progress-bar"></div>
          </div>
          <span id="run-progress-text" class="muted"></span>
        </div>
      </div>
    </section>

    <section class="panel right-panel">
      <div class="panel-head">
        <h2 data-i18n="resultTitle"></h2>
      </div>
      <div id="result-banner" class="result-banner" hidden></div>
      <div id="compare-box" class="compare-box" hidden>
        <img id="compare-final" class="compare-final" alt="处理后" draggable="false" />
        <img id="compare-source" class="compare-source" alt="处理前" draggable="false" />
        <span class="compare-tag compare-tag-l" data-i18n="tagAfter"></span>
        <span class="compare-tag compare-tag-r" data-i18n="tagBefore"></span>
        <div id="compare-handle" class="compare-handle"></div>
      </div>
      <div class="review-grid">
        <figure class="review-box">
          <figcaption><i class="dot dot-candidate"></i><span data-i18n="beforePreview"></span></figcaption>
          <div id="review-candidate" class="review-img"><div class="placeholder" data-i18n="placeholderBefore"></div></div>
        </figure>
        <figure class="review-box">
          <figcaption><i class="dot dot-final"></i><span data-i18n="afterPreview"></span></figcaption>
          <div id="review-final" class="review-img"><div class="placeholder" data-i18n="placeholderAfter"></div></div>
        </figure>
      </div>
      <details id="log-box" class="log-box">
        <summary>
          <span data-i18n="logTitle"></span>
          <button id="btn-clear-log" class="btn small ghost" type="button" data-i18n="clearLog"></button>
        </summary>
        <pre id="log" class="log"></pre>
      </details>
    </section>
  </main>

  <div id="disclaimer-overlay" class="mask-overlay" hidden>
    <div class="mask-dialog disclaimer-dialog">
      <h3 data-i18n="disclaimerTitle"></h3>
      <div class="disclaimer-body">
        <p data-i18n-html="disclaimerBody1"></p>
        <p data-i18n-html="disclaimerBody2"></p>
      </div>
      <div class="mask-foot">
        <span class="muted" data-i18n="disclaimerOnly"></span>
        <button id="btn-disclaimer-ok" class="btn primary small" type="button" data-i18n="disclaimerAgree"></button>
      </div>
    </div>
  </div>

  <div id="mask-overlay" class="mask-overlay" hidden>
    <div class="mask-dialog">
      <div class="mask-head">
        <span data-i18n="maskHead"></span>
        <button id="btn-mask-cancel" class="btn small ghost" type="button" data-i18n="maskCancel"></button>
      </div>
      <div id="mask-canvas-wrap" class="mask-canvas-wrap">
        <img id="mask-img" src="" alt="框选参考图" draggable="false" />
        <div id="mask-rect" class="mask-rect" hidden></div>
      </div>
      <div class="mask-foot">
        <span id="mask-hint" class="muted" data-i18n="maskHint"></span>
        <div>
          <button id="btn-mask-reset" class="btn small ghost" type="button" disabled data-i18n="maskReset"></button>
          <button id="btn-mask-ok" class="btn primary small" type="button" disabled data-i18n="maskOk"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox">
    <img src="" alt="预览大图" />
  </div>

  <script src="mock.js"></script>
  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
