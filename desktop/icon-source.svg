<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 矢量设计源。重新渲染栅格源图：rsvg-convert -w 1024 -h 1024 icon-source.svg -o icon-source.png -->
  <!-- 再用 desktop/icon.json 生成全套：pnpm tauri icon icon.json -->
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0.02" x2="0.92" y2="0.98">
      <stop offset="0" stop-color="#4c3fdf"/>
      <stop offset="0.52" stop-color="#6a4ef0"/>
      <stop offset="1" stop-color="#9557f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.14" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#d7e0ff"/>
      <stop offset="1" stop-color="#f4f5ff"/>
    </linearGradient>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#241a7a" flood-opacity="0.35"/>
    </filter>
    <clipPath id="pcardClip">
      <rect x="380" y="406" width="264" height="200" rx="28"/>
    </clipPath>
    <mask id="pcardMask">
      <rect x="0" y="0" width="1024" height="1024" fill="#ffffff"/>
      <path d="M 644 476 A 122 122 0 0 1 526 600 L 644 600 Z" fill="#000000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="226" fill="url(#glow)"/>

  <g transform="rotate(-8 512 512)" stroke-linecap="round">
    <circle cx="512" cy="512" r="240" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="30"/>
    <circle cx="512" cy="512" r="240" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="30"
            stroke-dasharray="1075 433" stroke-dashoffset="-235"/>

    <g mask="url(#pcardMask)">
      <g filter="url(#cardShadow)">
        <rect x="380" y="406" width="264" height="200" rx="28" fill="#ffffff"/>
      </g>
      <g clip-path="url(#pcardClip)">
        <rect x="380" y="406" width="264" height="200" fill="url(#sky)"/>
        <circle cx="584" cy="458" r="18" fill="#ffb020"/>
        <path d="M 380 606 L 478 482 L 566 606 Z" fill="#5d6bff"/>
        <path d="M 530 606 L 598 522 L 668 606 Z" fill="#9fb0ff"/>
      </g>
    </g>
    <path d="M 644 476 A 122 122 0 0 1 526 600" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6" fill="none"/>
  </g>

  <circle cx="604" cy="642" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="644" cy="612" r="7" fill="#ffffff" opacity="0.72"/>
  <circle cx="676" cy="578" r="5" fill="#ede9ff" opacity="0.55"/>
  <circle cx="702" cy="704" r="12" fill="#ffffff" opacity="0.95"/>
  <circle cx="744" cy="660" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="776" cy="614" r="5.5" fill="#e9e4ff" opacity="0.6"/>

  <g fill="#ffffff">
    <path d="M 0 -30 C 3.5 -11 11 -3.5 30 0 C 11 3.5 3.5 11 0 30 C -3.5 11 -11 3.5 -30 0 C -11 -3.5 -3.5 -11 0 -30 Z" transform="translate(722,630) scale(0.56)" opacity="0.95"/>
    <path d="M 0 -30 C 3.5 -11 11 -3.5 30 0 C 11 3.5 3.5 11 0 30 C -3.5 11 -11 3.5 -30 0 C -11 -3.5 -3.5 -11 0 -30 Z" transform="translate(272,262) scale(0.72)" opacity="0.9"/>
  </g>
