name: Desktop Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ["desktop/**", "tools/**", ".github/workflows/desktop-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile=false

      - name: Build app
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          pnpm tauri build --target ${{ matrix.target }} 2>&1 | tee build.log

      - name: Emit error summary
        if: failure()
        working-directory: desktop
        shell: bash
        run: |
          (grep -iE "error\[|error:|failed to" build.log | tail -30; echo "---- tail ----"; tail -8 build.log) | sed 's/::/: :/g' | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: doubao-watermark-remover-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: doubao-watermark-remover-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R dist
          for i in 1 2 3 4 5 6; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes || true
            if gh release upload "$GITHUB_REF_NAME" dist/* --clobber; then
              exit 0
            fi
            sleep 20
          done
          exit 1
