name: Desktop Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ["desktop/**", "tools/**", ".github/workflows/desktop-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile=false

      - name: Run unit tests
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test --quiet 2>&1 | tee test.log

      - name: Restore LaMa model
        id: lama-cache
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/.models/lama_fp32.onnx
          key: lama-onnx-fp32-v1

      - name: Download LaMa model
        if: steps.lama-cache.outputs.cache-hit != 'true'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          mkdir -p .models
          curl -fL --retry 3 -o .models/lama_fp32.onnx \
            https://hf-mirror.com/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx

      - name: Run pipeline e2e with real model
        working-directory: desktop/src-tauri
        shell: bash
        env:
          LAMA_MODEL: .models/lama_fp32.onnx
        run: cargo test --quiet -- --ignored

      - name: Build app
        working-directory: desktop
        shell: bash
        # 刻意不传 APPLE_* secrets：macOS 交付走本地打包（tools/package-app.sh mac，
        # 用本地钥匙串签名/公证），CI 只验证「代码能在 macOS 上构建」。此前 secrets
        # 里的 p12 在 CI 上 security import 失败（"failed to import keychain
        # certificate"）导致打包中断。将来若要恢复 CI 签名：先确保 APPLE_CERTIFICATE
        # 的 p12 能被 security import（Keychain 原生导出或 openssl -legacy 格式），
        # 再在此处加回 env（APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
        # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID）。
        run: |
          set -o pipefail
          pnpm tauri build --target ${{ matrix.target }} 2>&1 | tee build.log

      # CI 产物未签名/未公证（签名走本地打包），这里只确认 .app 真的产出。
      - name: Verify macOS artifact
        if: runner.os == 'macOS'
        working-directory: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        shell: bash
        run: |
          app="$(ls -d *.app 2>/dev/null | head -1)"
          if [ -z "$app" ]; then
            echo "::error::未找到 macOS .app 产物"
            exit 1
          fi
          echo "[OK] $app 构建成功（CI 不签名；发布包在本地用 tools/package-app.sh mac 构建）"

      - name: Emit error summary
        if: failure()
        working-directory: desktop
        shell: bash
        run: |
          if [ -f build.log ]; then log=build.log
          elif [ -f src-tauri/test.log ]; then log=src-tauri/test.log
          else echo "::error::未找到 test.log/build.log（失败发生在更早步骤，见该步骤日志）"; exit 0; fi
          (grep -iE "error\[|error:|failed to|panicked" "$log" | tail -30; echo "---- tail ----"; tail -8 "$log") | sed 's/::/: :/g' | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: watermark-cleaner-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: watermark-cleaner-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          exec > >(tee attach.log) 2>&1
          ls -R dist
          gh auth status || true
          gh api repos/${GITHUB_REPOSITORY}/releases --paginate --jq '.[] | select(.draft) | select(.tag_name=="'"$GITHUB_REF_NAME"'") | .id' | while read -r id; do gh api -X DELETE repos/${GITHUB_REPOSITORY}/releases/$id || true; done
          for i in 1 2 3 4 5 6; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true
            if gh release upload "$GITHUB_REF_NAME" dist/* --clobber; then
              exit 0
            fi
            sleep 20
          done
          exit 1
      - name: Emit attach error summary
        if: failure()
        run: |
          tail -30 attach.log 2>/dev/null | sed 's/::/: :/g' | while IFS= read -r line; do echo "::error::$line"; done
