name: Desktop Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ["desktop/**", "tools/**", ".github/workflows/desktop-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile=false

      - name: Run unit tests
        working-directory: desktop/src-tauri
        shell: bash
        run: cargo test --quiet

      - name: Restore LaMa model
        id: lama-cache
        uses: actions/cache@v4
        with:
          path: desktop/src-tauri/.models/lama_fp32.onnx
          key: lama-onnx-fp32-v1

      - name: Download LaMa model
        if: steps.lama-cache.outputs.cache-hit != 'true'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          mkdir -p .models
          curl -fL --retry 3 -o .models/lama_fp32.onnx \
            https://hf-mirror.com/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx

      - name: Run pipeline e2e with real model
        working-directory: desktop/src-tauri
        shell: bash
        env:
          LAMA_MODEL: .models/lama_fp32.onnx
        run: cargo test --quiet -- --ignored

      - name: Build app
        working-directory: desktop
        shell: bash
        env:
          # macOS 签名+公证接入点：在仓库 Secrets 配置以下项即自动启用（全部可选）。
          # APPLE_CERTIFICATE: base64 编码的 .p12 开发者证书
          # APPLE_CERTIFICATE_PASSWORD: .p12 密码
          # APPLE_SIGNING_IDENTITY: "Developer ID Application: ..."
          # APPLE_ID / APPLE_PASSWORD(app-specific) / APPLE_TEAM_ID: 公证账号
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          pnpm tauri build --target ${{ matrix.target }} 2>&1 | tee build.log

      - name: Emit error summary
        if: failure()
        working-directory: desktop
        shell: bash
        run: |
          (grep -iE "error\[|error:|failed to" build.log | tail -30; echo "---- tail ----"; tail -8 build.log) | sed 's/::/: :/g' | while IFS= read -r line; do echo "::error::$line"; done

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: watermark-cleaner-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: watermark-cleaner-${{ matrix.target }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          exec > >(tee attach.log) 2>&1
          ls -R dist
          gh auth status || true
          gh api repos/${GITHUB_REPOSITORY}/releases --paginate --jq '.[] | select(.draft) | select(.tag_name=="'"$GITHUB_REF_NAME"'") | .id' | while read -r id; do gh api -X DELETE repos/${GITHUB_REPOSITORY}/releases/$id || true; done
          for i in 1 2 3 4 5 6; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true
            if gh release upload "$GITHUB_REF_NAME" dist/* --clobber; then
              exit 0
            fi
            sleep 20
          done
          exit 1
      - name: Emit attach error summary
        if: failure()
        run: |
          tail -30 attach.log 2>/dev/null | sed 's/::/: :/g' | while IFS= read -r line; do echo "::error::$line"; done
