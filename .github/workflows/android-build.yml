name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;26.3.11579264"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install

      - name: Init Android project
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init 2>&1 | tee init.log
          fi
          pnpm tauri icon icon-source.png 2>&1 | tee icon.log

      - name: Init error summary
        if: failure()
        working-directory: desktop
        shell: bash
        run: |
          (cat icon.log 2>/dev/null; cat init.log 2>/dev/null) | tail -20 | sed 's/::/: :/g' | while IFS= read -r line; do echo "::error::$line"; done

      - name: Build debug APK
        working-directory: desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          set -o pipefail
          pnpm tauri android build --apk --debug --target aarch64 2>&1 | tee build.log

      - name: Emit error summary
        if: failure()
        working-directory: desktop
        run: |
          (grep -iE "error\[|error:|failed to" build.log | tail -40; echo "---- tail ----"; tail -10 build.log) | sed 's/::/: :/g' | while IFS= read -r line; do echo "::error::$line"; done

      - uses: actions/upload-artifact@v4
        with:
          name: doubao-watermark-remover-apk
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
